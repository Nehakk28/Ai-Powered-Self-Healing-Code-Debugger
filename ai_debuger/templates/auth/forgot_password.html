<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>DebugAI - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#356769",
                        "background-light": "#f9fafa",
                        "background-dark": "#242628",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        .debug-grid {
            background-size: 40px 40px;
            background-image: radial-gradient(circle, #35676911 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col">
    <header class="flex items-center justify-between border-b border-[#ebefef] dark:border-[#3a3d40] px-6 py-4 md:px-10">
        <div class="flex items-center gap-3 text-primary dark:text-white">
            <div class="size-8 flex items-center justify-center bg-primary text-white rounded-lg">
                <span class="material-symbols-outlined text-xl">terminal</span>
            </div>
            <h2 class="text-[#121717] dark:text-white text-lg font-bold tracking-[-0.015em]">DebugAI</h2>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-6 debug-grid">
        <div class="w-full max-w-[440px]">
            <div class="bg-white dark:bg-[#2d3033] rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-[#ebefef] dark:border-[#3a3d40] overflow-hidden">
                <div class="px-8 pt-10 pb-6 text-center">
                    <h1 class="text-[#121717] dark:text-white text-2xl font-bold tracking-tight">Forgot Password</h1>
                    <p class="text-[#648182] dark:text-white/60 text-sm mt-2">Enter your email and we'll send you a reset link.</p>
                </div>
                
                <div class="px-8 pb-10">
                    {% if messages %}
                    <div class="mb-4 space-y-2">
                        {% for message in messages %}
                        <div class="p-3 rounded-lg text-sm font-medium {% if message.tags == 'error' %}bg-red-50 text-red-600 dark:bg-red-900/20 dark:text-red-400{% else %}bg-green-50 text-green-600 dark:bg-green-900/20 dark:text-green-400{% endif %}">
                            {{ message }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    
                    <form method="post" class="space-y-5">
                        {% csrf_token %}
                        <div class="space-y-2">
                            <label class="block text-[#121717] dark:text-white/90 text-sm font-semibold" for="email">Email address</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#648182] text-xl">alternate_email</span>
                                <input class="w-full pl-10 pr-4 h-12 rounded-lg border border-[#d7e0e0] dark:border-[#3a3d40] bg-background-light dark:bg-background-dark text-[#121717] dark:text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="email" name="email" placeholder="name@company.com" required type="email" />
                            </div>
                        </div>
                        <button class="w-full h-12 bg-primary hover:bg-opacity-90 text-white font-bold rounded-lg transition-all flex items-center justify-center gap-2 mt-2" type="submit">
                            <span>Send Reset Link</span>
                            <span class="material-symbols-outlined text-sm">send</span>
                        </button>
                    </form>
                    
                    <div class="mt-8 pt-6 border-t border-[#ebefef] dark:border-[#3a3d40] text-center">
                        <p class="text-[#648182] dark:text-white/60 text-sm">
                            Remember your password?
                            <a class="text-primary font-bold hover:underline ml-1" href="{% url 'users:login' %}">Log in</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="py-6 px-10 border-t border-[#ebefef] dark:border-[#3a3d40] flex justify-between items-center">
        <div class="text-[12px] text-[#648182] dark:text-white/40">© 2024 DebugAI Systems Inc.</div>
    </footer>
</body>
</html>
